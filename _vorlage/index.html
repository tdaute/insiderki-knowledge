<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{DECK_TITEL}} | KNOWLEDGE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e1a;
  --bg-2:#0d1424;
  --panel:#111a2c;
  --panel-2:#0f1729;
  --orange:#e8863c;
  --orange-br:#f59e42;
  --white:#ffffff;
  --grey:#9aa3b2;
  --grey-2:#6b7280;
  --line:rgba(255,255,255,.08);
  --line-2:rgba(255,255,255,.14);
  --green:#3fb27f;
  --red:#e05252;
  --amber:#e0a83c;
  --blue:#5b8def;
  --sig:#C21D1A;
  --sig-br:#e04340;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  background:#05070d;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  color:var(--white);
  overflow:hidden;
}

/* ============ DECK ============ */
.deck{position:relative;width:100vw;height:100vh;}
.slide{
  position:absolute;inset:0;
  opacity:0;visibility:hidden;
  transition:opacity .4s ease;
  background:var(--bg);
  overflow:hidden;
}
.slide.active{opacity:1;visibility:visible;}

/* Atmosphere */
.atmos{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.atmos::before{
  content:'';position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
  background-size:110px 110px;
}
.atmos::after{
  content:'';position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  width:120vw;height:90vh;
  background:radial-gradient(ellipse at center,rgba(232,134,60,.20) 0%,rgba(232,134,60,.06) 34%,transparent 62%);
}
.atmos.soft::after{opacity:.4;}

/* ============ LOGO (Obsidian-Graph-Stil) ============ */
.logo{display:flex;flex-direction:column;align-items:center;gap:.45rem;}
.logo svg{display:block;overflow:visible;}
.logo-word{font-size:.72rem;font-weight:700;letter-spacing:.26em;color:var(--sig);white-space:nowrap;}
.logo-corner{position:absolute;top:1.6rem;right:2.2rem;z-index:6;transform:scale(.75);transform-origin:top right;}

/* ============ CHROME (Sidebar + Header) ============ */
.chrome{position:relative;z-index:2;height:100%;display:grid;grid-template-columns:230px 1fr;}
.sidebar{
  background:rgba(255,255,255,.022);
  border-right:1px solid var(--line);
  padding:1.9rem 1.1rem;
  display:flex;flex-direction:column;
  backdrop-filter:blur(6px);
}
.sb-brand{display:flex;flex-direction:column;align-items:center;gap:.4rem;margin-bottom:2.6rem;}
.sb-brand .logo-word{font-size:.68rem;}
.sb-nav{display:flex;flex-direction:column;gap:.15rem;}
.sb-item{
  font-size:.76rem;font-weight:400;color:var(--grey-2);
  padding:.42rem .6rem;border-radius:6px;
  line-height:1.3;text-align:center;
  transition:color .2s,background .2s;
  cursor:default;
}
.sb-item{
  font-family:inherit;border:none;background:none;width:100%;
  cursor:pointer;
}
.sb-item:hover{color:#c3cad6;background:rgba(255,255,255,.04);}
.sb-item:focus-visible{outline:2px solid var(--orange);outline-offset:-2px;}
.sb-item.on{color:var(--orange);font-weight:600;background:rgba(232,134,60,.09);}
.sb-item.on:hover{color:var(--orange-br);}

/* Echte Medien (ersetzen Platzhalter, wenn konfiguriert) */
.media{width:100%;aspect-ratio:1/1;border-radius:10px;object-fit:cover;display:block;background:rgba(255,255,255,.03);}
.media.tall,.media.wide{aspect-ratio:1/1;}
video.media{object-fit:contain;background:rgba(0,0,0,.35);}

/* ---- Quiz-Folie ---- */
.quiz{display:flex;flex-direction:column;gap:1rem;align-items:center;width:100%;}
.quiz-cols{
  display:grid;grid-template-columns:1fr 1fr;
  gap:1.6rem;width:100%;
}
.quiz-block{min-width:0;}
.quiz-row{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;}
.quiz-lbl{
  font-size:.72rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
  color:var(--orange);margin-bottom:.55rem;text-align:center;
}
.qcard{
  position:relative;background:rgba(255,255,255,.026);
  border:1px solid var(--line);border-radius:12px;
  padding:.6rem;cursor:pointer;
  transition:border-color .25s,background .25s,transform .18s;
}
.qcard:hover{border-color:var(--line-2);transform:translateY(-2px);}
.qcard:focus-visible{outline:2px solid var(--orange);outline-offset:2px;}
.qcard .tag{
  position:absolute;top:1rem;left:1rem;z-index:3;
  background:rgba(10,14,26,.85);backdrop-filter:blur(6px);
  border:1px solid var(--line-2);border-radius:5px;
  font-family:'JetBrains Mono',monospace;font-size:.66rem;font-weight:600;
  padding:.16rem .45rem;color:var(--white);letter-spacing:.08em;
}
/* Quadratisches Medienfenster (1:1), erzwungen */
.qcard .qmedia{
  display:block;width:100%;height:auto;min-height:0;
  aspect-ratio:1/1;object-fit:cover;
  border-radius:8px;overflow:hidden;
}
.qcard .qmedia.ph{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.3rem;color:rgba(255,255,255,.3);
  font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.028) 0 10px,rgba(255,255,255,.012) 10px 20px);
  border:1px dashed rgba(255,255,255,.16);
}
/* Videos: ganzen Frame zeigen statt beschneiden */
.qcard video.qmedia{object-fit:contain;background:rgba(0,0,0,.35);}
.qcard .verdict{
  margin-top:.7rem;text-align:center;font-size:.82rem;font-weight:700;
  min-height:1.3em;opacity:0;transition:opacity .3s;letter-spacing:.01em;
}
.quiz.revealed .qcard .verdict{opacity:1;}
.quiz.revealed .qcard[data-ai="1"]{border-color:rgba(224,82,82,.55);background:rgba(224,82,82,.07);}
.quiz.revealed .qcard[data-ai="0"]{border-color:rgba(63,178,127,.5);background:rgba(63,178,127,.06);}
.qcard[data-ai="1"] .verdict{color:#f08b8b;}
.qcard[data-ai="0"] .verdict{color:#6cd3a4;}
.quiz-bar{display:flex;align-items:center;justify-content:center;gap:1rem;margin-top:.2rem;}
.quiz-btn{
  font-family:inherit;font-size:.82rem;font-weight:600;
  background:rgba(232,134,60,.13);color:var(--orange-br);
  border:1px solid rgba(232,134,60,.42);border-radius:8px;
  padding:.55rem 1.6rem;cursor:pointer;transition:background .2s;
}
.quiz-btn:hover{background:rgba(232,134,60,.22);}
.quiz-btn:focus-visible{outline:2px solid var(--orange);outline-offset:2px;}
.quiz-hint{font-size:.78rem;color:var(--grey-2);font-style:italic;}
.sb-foot{margin-top:auto;font-size:.6rem;color:rgba(255,255,255,.2);letter-spacing:.1em;text-align:center;}

.stage{padding:3.4rem 2.6rem 1.6rem;display:flex;flex-direction:column;min-height:0;overflow:hidden;}
/* Header-Block: vertikaler Signalrot-Strich links, Eyebrow + Titel eingerueckt */
.head{position:relative;padding-left:1.15rem;margin-bottom:1.15rem;}
.head::before{
  content:'';position:absolute;left:0;top:.12em;bottom:.12em;
  width:4px;border-radius:2px;background:var(--sig);
}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.2em;color:var(--orange);text-transform:uppercase;margin-bottom:.5rem;}
.h1{font-size:clamp(1.6rem,2.9vw,2.5rem);font-weight:700;letter-spacing:-.028em;line-height:1.08;}
.lead{font-size:.92rem;color:#c3cad6;line-height:1.55;max-width:74ch;margin-bottom:1.3rem;}
.lead b{color:var(--orange-br);font-weight:600;}
.lead u{text-decoration-color:var(--orange);text-underline-offset:3px;}
.body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;}
.foot{margin-top:1rem;font-size:.72rem;color:var(--grey-2);font-style:italic;}

/* Role badge */
.badge{
  position:absolute;top:2.4rem;right:2.6rem;z-index:4;
  font-size:.86rem;font-weight:700;letter-spacing:.03em;
  padding:.55rem 1.5rem;border-radius:999px;
}
.badge.anbieter{background:rgba(91,141,239,.26);color:#bcd0fb;border:2px solid rgba(91,141,239,.72);}
.badge.betreiber{background:rgba(63,178,127,.24);color:#9ce6c3;border:2px solid rgba(63,178,127,.7);}
.badge.beide{background:rgba(232,134,60,.24);color:#f7bd8a;border:2px solid rgba(232,134,60,.72);}
/* Inline-Varianten (in Karten) behalten die kompakte Groesse */
.badge.inline{position:static;display:inline-block;font-size:.72rem;padding:.26rem .85rem;border-width:1px;}

/* ============ TITLE SLIDES ============ */
.title-wrap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 6vw;}
.t-eyebrow{font-size:clamp(.8rem,1.2vw,1.05rem);font-weight:500;letter-spacing:.42em;color:var(--orange);text-transform:uppercase;margin-bottom:1.5rem;padding-left:.42em;}
.t-head{font-size:clamp(2.6rem,7vw,6rem);font-weight:800;line-height:.98;letter-spacing:-.038em;}
.t-sub{margin-top:1.6rem;font-size:clamp(.95rem,1.6vw,1.4rem);color:var(--grey);font-weight:400;}
.t-meta{margin-top:3.2rem;display:flex;flex-direction:column;gap:.3rem;align-items:center;}
.t-meta .nm{font-size:1.05rem;font-weight:700;letter-spacing:-.01em;}
.t-meta .rl{font-size:.82rem;color:var(--grey);line-height:1.6;}
.counter{
  position:absolute;bottom:2.6rem;left:50%;transform:translateX(-50%);
  font-family:'JetBrains Mono',monospace;font-size:.7rem;
  color:rgba(255,255,255,.28);letter-spacing:.24em;
}

/* Section divider slides */
.sec-wrap{position:relative;z-index:2;height:100%;display:grid;grid-template-columns:230px 1fr;}
.sec-body{display:flex;flex-direction:column;justify-content:center;padding:0 5vw;}
.sec-num{
  align-self:flex-start;
  font-family:'JetBrains Mono',monospace;font-size:.78rem;font-weight:500;
  letter-spacing:.22em;color:#fff;text-transform:uppercase;
  background:var(--sig);border-radius:999px;padding:.42rem 1.25rem;
  margin-bottom:1.5rem;
}
/* Titel + Untertitel gemeinsam hinter vertikalem Signalrot-Strich */
.sec-main{position:relative;padding-left:1.6rem;}
.sec-main::before{
  content:'';position:absolute;left:0;top:.1em;bottom:.1em;
  width:5px;border-radius:3px;background:var(--sig);
}
.sec-title{font-size:clamp(2.2rem,4.6vw,3.6rem);font-weight:800;letter-spacing:-.032em;line-height:1.05;}
.sec-art{font-size:.95rem;color:var(--grey);margin-top:.9rem;font-family:'JetBrains Mono',monospace;letter-spacing:.02em;}

/* ============ COMPONENTS ============ */
.grid{display:grid;gap:.85rem;}
.g2{grid-template-columns:repeat(2,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g4{grid-template-columns:repeat(4,1fr);}
.g5{grid-template-columns:repeat(5,1fr);}

.card{
  background:rgba(255,255,255,.026);
  border:1px solid var(--line);
  border-radius:13px;
  padding:1.35rem 1.35rem 1.45rem;
  display:flex;flex-direction:column;
}
.card.ok{border-color:rgba(63,178,127,.34);background:rgba(63,178,127,.05);}
.card.no{border-color:rgba(224,82,82,.34);background:rgba(224,82,82,.05);}
.card.warn{border-color:rgba(224,168,60,.34);background:rgba(224,168,60,.05);}
.card.acc{border-color:rgba(232,134,60,.32);background:rgba(232,134,60,.05);}
.card h3{font-size:1rem;font-weight:700;letter-spacing:-.012em;margin-bottom:.45rem;line-height:1.3;}
.card .sub{font-size:.74rem;color:var(--orange);font-family:'JetBrains Mono',monospace;margin-bottom:.7rem;}
.card p{font-size:.84rem;color:var(--grey);line-height:1.62;}
.card ul{list-style:none;margin-top:.8rem;display:flex;flex-direction:column;gap:.6rem;}
.card li{font-size:.82rem;color:#b6bdc9;display:flex;gap:.55rem;align-items:flex-start;line-height:1.6;}
.card li::before{content:'—';color:var(--orange);flex-shrink:0;}
/* Aufzaehlung ohne Listen-Icon */
.card ul.bare li::before{content:none;}
.card ul.bare li{gap:0;}

.num{
  width:26px;height:26px;border-radius:50%;
  background:var(--orange);color:#0a0e1a;
  display:flex;align-items:center;justify-content:center;
  font-size:.78rem;font-weight:800;margin-bottom:.7rem;flex-shrink:0;
}
.tick{color:var(--green);font-weight:700;}
.cross{color:var(--red);font-weight:700;}

/* Placeholder image */
.ph{
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.028) 0 10px,rgba(255,255,255,.012) 10px 20px);
  border:1px dashed rgba(255,255,255,.16);
  border-radius:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.3rem;color:rgba(255,255,255,.3);
  font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;text-align:center;padding:.4rem;
  aspect-ratio:1/1;
}
.ph .ico{font-size:1.1rem;opacity:.6;}
.ph.tall,.ph.wide{aspect-ratio:1/1;}
/* In dichten Rastern die Quadrate zentriert begrenzen, damit die Folie nicht ueberlaeuft.
   Begrenzung ueber die Breite, damit das 1:1-Verhaeltnis erhalten bleibt. */
.g4 .ph,.g4 .media,.g5 .ph,.g5 .media,
.g3 .ph,.g3 .media{margin-left:auto;margin-right:auto;}
.g5 .ph,.g5 .media{max-width:22vh;}
.g4 .ph,.g4 .media{max-width:26vh;}
.g3 .ph,.g3 .media{max-width:30vh;}
.g2 .ph,.g2 .media{max-width:38vh;margin-left:auto;margin-right:auto;}

/* Flow chain */
.chain{display:grid;align-items:stretch;gap:0;}
.chain .arw{display:flex;align-items:center;justify-content:center;color:var(--orange);font-size:1.35rem;padding:0 .7rem;}

/* Callout */
.callout{
  margin-top:1.1rem;
  background:linear-gradient(90deg,rgba(232,134,60,.15) 0%,rgba(232,134,60,.04) 68%,transparent 100%);
  border-left:4px solid var(--orange);
  border-radius:0 9px 9px 0;
  padding:.9rem 1.3rem;
  font-size:.84rem;color:#dfe4ec;line-height:1.5;
}
.callout strong{color:var(--orange-br);font-weight:700;}
.callout.green{background:linear-gradient(90deg,rgba(63,178,127,.14) 0%,transparent 70%);border-left-color:var(--green);}
.callout.green strong{color:#6cd3a4;}
.callout.red{background:linear-gradient(90deg,rgba(224,82,82,.14) 0%,transparent 70%);border-left-color:var(--red);}
.callout.red strong{color:#f08b8b;}

/* Split heads */
.split-head{
  display:flex;align-items:center;gap:.55rem;
  font-size:.92rem;font-weight:700;margin-bottom:.7rem;
}
.dot-i{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:800;flex-shrink:0;}
.dot-i.g{background:var(--green);color:#06180f;}
.dot-i.r{background:var(--red);color:#210606;}
.dot-i.a{background:var(--amber);color:#1e1503;}

/* Timeline */
.tl{position:relative;padding:1.6rem 0 .6rem;}
.tl-line{height:2px;background:linear-gradient(90deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.16) 48%,var(--orange) 52%,var(--orange) 100%);border-radius:2px;}
.tl-marks{display:flex;justify-content:space-between;margin-top:-6px;}
.tl-m{display:flex;flex-direction:column;align-items:center;gap:.5rem;flex:1;}
.tl-m .pt{width:11px;height:11px;border-radius:50%;background:var(--grey-2);border:2px solid var(--bg);}
.tl-m.hot .pt{background:var(--orange);box-shadow:0 0 0 4px rgba(232,134,60,.2);}
.tl-m .dt{font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:600;color:var(--white);}
.tl-m.hot .dt{color:var(--orange);}
.tl-m .lb{font-size:.7rem;color:var(--grey);text-align:center;max-width:15ch;line-height:1.35;}

/* Decision tree */
.tree{display:flex;flex-direction:column;gap:.42rem;align-items:center;}
.tree-row{display:grid;grid-template-columns:1fr 90px 130px;align-items:center;gap:.7rem;width:100%;max-width:900px;}
.tree-q{
  background:rgba(255,255,255,.035);border:1px solid var(--line);
  border-radius:8px;padding:.62rem .9rem;
  font-size:.78rem;line-height:1.35;text-align:center;
}
.tree-q b{color:var(--orange-br);}
.tree-y,.tree-n{
  font-size:.7rem;font-weight:700;padding:.3rem .55rem;border-radius:6px;text-align:center;
}
.tree-y{background:rgba(63,178,127,.14);color:#6cd3a4;border:1px solid rgba(63,178,127,.36);}
.tree-n{background:rgba(224,82,82,.14);color:#f08b8b;border:1px solid rgba(224,82,82,.36);}
.tree-end{display:flex;gap:1.1rem;margin-top:.7rem;}
.pill{padding:.6rem 1.5rem;border-radius:8px;font-size:.82rem;font-weight:700;}
.pill.red{background:rgba(224,82,82,.18);color:#f08b8b;border:1px solid rgba(224,82,82,.42);}
.pill.green{background:rgba(63,178,127,.16);color:#6cd3a4;border:1px solid rgba(63,178,127,.42);}

/* Fine boxes */
.fine{display:grid;grid-template-columns:repeat(2,1fr);gap:1.1rem;}
.fine-box{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:13px;padding:1.4rem;text-align:center;}
.fine-box.hi{border-color:rgba(232,134,60,.4);background:rgba(232,134,60,.06);}
.fine-amt{font-size:clamp(1.4rem,2.5vw,2rem);font-weight:800;letter-spacing:-.03em;color:var(--orange-br);line-height:1.15;}
.fine-box:not(.hi) .fine-amt{color:var(--white);}
.fine-or{font-size:.82rem;color:var(--grey);margin:.4rem 0;}
.fine-src{font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--grey-2);margin-top:.8rem;}
.fine-lbl{font-size:.82rem;font-weight:600;margin-bottom:.9rem;color:#c3cad6;}

/* AI Icons */
.aiicons{display:flex;gap:6rem;justify-content:center;align-items:center;flex-wrap:wrap;}
.aii{display:flex;flex-direction:column;align-items:center;gap:.8rem;}
.aii .chip{
  background:#0a0e1a;border:2px solid var(--white);border-radius:999px;
  padding:.6rem 1.5rem;font-weight:800;letter-spacing:.06em;font-size:1.05rem;
  display:flex;align-items:center;gap:.6rem;
}
.aii .chip.round{border-radius:50%;width:64px;height:64px;padding:0;justify-content:center;}
.aii .cap{font-size:.76rem;color:var(--grey);text-align:center;line-height:1.4;}
.chip .sm{font-size:.72rem;letter-spacing:.14em;font-weight:600;}

/* Checklist */
.check{display:flex;flex-direction:column;gap:.5rem;}
.check-i{
  display:flex;gap:.8rem;align-items:flex-start;
  background:rgba(255,255,255,.025);border:1px solid var(--line);
  border-radius:9px;padding:.7rem .95rem;
}
.check-i .k{
  width:22px;height:22px;border-radius:5px;background:rgba(232,134,60,.16);
  color:var(--orange);font-size:.7rem;font-weight:800;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.check-i .t{font-size:.8rem;line-height:1.45;color:#c3cad6;}
.check-i .t b{color:var(--white);font-weight:600;}

/* Two-col text+visual */
.tv{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;align-items:center;}

/* Stat row */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.85rem;}
.stat-top{display:flex;align-items:center;gap:.7rem;margin-bottom:.8rem;}
.stat-pct{
  background:var(--green);color:#06180f;font-weight:800;font-size:.82rem;
  padding:.24rem .62rem;border-radius:999px;
}
.stat-pct.mid{background:var(--amber);color:#1e1503;}
.stat-pct.low{background:rgba(255,255,255,.16);color:var(--white);}

/* ============ NAV ============ */
.nav{
  position:fixed;bottom:1.1rem;left:50%;transform:translateX(-50%);
  z-index:60;display:flex;align-items:center;gap:.9rem;
  background:rgba(10,14,26,.82);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:999px;padding:.42rem .95rem;
  opacity:.28;transition:opacity .25s;
}
.nav:hover{opacity:1;}
.nav button{background:none;border:none;color:var(--grey);cursor:pointer;font-size:.95rem;padding:.2rem .35rem;transition:color .2s;}
.nav button:hover{color:var(--orange);}
.nav button:focus-visible{outline:2px solid var(--orange);outline-offset:3px;border-radius:4px;}
.nav .pos{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--grey);min-width:52px;text-align:center;}

/* ============ SEITENVERHAELTNISSE ============ */
.ph.r169,.media.r169{aspect-ratio:16/9;max-width:none;}

<script>
/* =====================================================================
   MEDIEN
   ---------------------------------------------------------------------
   Bilder und Videos werden im Media Manager hochgeladen und von dort
   automatisch geladen. Hier ist nichts einzutragen.
   Fallback: MEDIA_FALLBACK unten kann manuell befuellt werden, falls
   die Praesentation einmal offline laufen soll.
   ===================================================================== */
const SB_URL = 'https://nblyvxnahkbvtatathbh.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ibHl2eG5haGtidnRhdGF0aGJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NzA5MTUsImV4cCI6MjA5NjE0NjkxNX0.o9-lp1ILDPFNcLOr_C3RMFsIFxVDkSCA0Zob1X__rB0';
const PRES_SLUG = '{{SLUG}}';   // <- Slug aus der Tabelle presentations

const MEDIA_FALLBACK = {};

/* Optionaler Quiz-Baustein. Nur noetig, wenn eine Quiz-Folie verwendet wird. */
const QUIZ_ANSWERS = { image: 'B', video: 'A' };

const MEDIA = Object.assign({}, MEDIA_FALLBACK);

function assetUrl(key){
  const v = MEDIA[key];
  return v || null;
}

/* Medien aus Supabase nachladen und Platzhalter ersetzen */
async function hydrateMedia(){
  try{
    const r = await fetch(
      `${SB_URL}/rest/v1/presentation_slots` +
      `?select=slot_key,public_url,presentations!inner(slug)` +
      `&presentations.slug=eq.${PRES_SLUG}` +
      `&public_url=not.is.null`,
      { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY } }
    );
    if(!r.ok) return;
    const rows = await r.json();
    if(!Array.isArray(rows) || !rows.length) return;

    rows.forEach(row=>{
      MEDIA[row.slot_key] = row.public_url;
      document.querySelectorAll(`[data-slot="${row.slot_key}"]`).forEach(el=>{
        const label   = el.getAttribute('data-label') || '';
        const isQuiz  = el.hasAttribute('data-quiz') || el.classList.contains('qmedia');
        const baseCls = isQuiz ? 'qmedia' : 'media';
        // Groessenklassen (tall/wide) vom Platzhalter uebernehmen
        const sizeCls = ['tall','wide','r169','r34','r11'].filter(c=>el.classList.contains(c)).join(' ');
        const vid     = /\.(mp4|webm|mov)(\?|$)/i.test(row.public_url);
        const node    = document.createElement(vid ? 'video' : 'img');
        node.className = [baseCls, sizeCls].filter(Boolean).join(' ');
        node.setAttribute('data-slot', row.slot_key);
        node.src = row.public_url;
        if(vid){
          node.muted = true; node.loop = true; node.playsInline = true;
          node.preload = 'metadata';
          node.setAttribute('playsinline','');
        } else {
          node.alt = label; node.loading = 'lazy';
        }
        el.replaceWith(node);
      });
    });
    if(typeof syncVideos === 'function') syncVideos();
  }catch(e){ /* offline: Platzhalter bleiben stehen */ }
}

/* ===================== LOGO (Obsidian-Graph-Stil) ===================== */
function logo(size, word){
  const s = size || 52;
  return `

/* Kapitel der Agenda-Sidebar. Die Reihenfolge hier bestimmt die Reihenfolge
   im Menue; der Sprung geht jeweils auf die erste Folie mit diesem nav-Wert. */
const NAV = [
  'Kapitel A','Kapitel B','Kapitel C'
];

function sidebar(active){
  return `<aside class="sidebar">
    <div class="sb-brand">${logo(40)}</div>
    <nav class="sb-nav">
      ${NAV.map(n=>`<button class="sb-item${n===active?' on':''}" data-jump="${n}">${n}</button>`).join('')}
    </nav>
    <div class="sb-foot">ART. 50 AI ACT</div>
  </aside>`;
}

/* Platzhalter ODER echtes Asset, je nach MEDIA-Konfiguration */
function ph(label, cls, key){
  const url = key ? assetUrl(key) : null;
  if(url){
    const isVid = /\.(mp4|webm)(\?|$)/i.test(url);
    if(isVid){
      return `<video class="media ${cls||''}" src="${url}" muted loop playsinline autoplay
                     aria-label="${label}"></video>`;
    }
    return `<img class="media ${cls||''}" src="${url}" alt="${label}" loading="lazy">`;
  }
  return `<div class="ph ${cls||''}"${key?` data-slot="${key}" data-label="${label}"`:''}><div class="ico">▣</div><div>${label}</div></div>`;
}

function SEC(o){

}

/* ===================== RENDER + NAV ===================== */
document.getElementById('deck').innerHTML = slides.join('');
const els = Array.from(document.querySelectorAll('.slide'));
let idx = 0;
const pos = document.getElementById('pos');

function go(n){
  idx = Math.max(0, Math.min(els.length-1, n));
  els.forEach((s,i)=>s.classList.toggle('active', i===idx));
  pos.textContent = (idx+1) + ' / ' + els.length;
  if(typeof syncVideos === 'function') syncVideos();
}
document.getElementById('next').onclick = ()=>go(idx+1);
document.getElementById('prev').onclick = ()=>go(idx-1);

/* ---- Agenda: erste Folie je Kapitel finden ---- */
const chapterStart = {};
els.forEach((el,i)=>{
  const on = el.querySelector('.sb-item.on');
  if(on){
    const name = on.dataset.jump;
    if(chapterStart[name] === undefined) chapterStart[name] = i;
  }
});

/* ---- Klick auf Menuepunkt springt zum Kapitel ---- */
document.querySelectorAll('.sb-item').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const t = chapterStart[btn.dataset.jump];
    if(t !== undefined) go(t);
  });
});

/* ---- Quiz ---- */
function revealQuiz(){
  const q = document.getElementById('quiz');
  if(q) q.classList.add('revealed');
}
document.addEventListener('click', e=>{
  if(e.target.closest('#quizReveal') || e.target.closest('.qcard')) revealQuiz();
});
document.addEventListener('keydown', e=>{
  if((e.key==='Enter'||e.key===' ') && document.activeElement?.classList.contains('qcard')){
    e.preventDefault(); revealQuiz();
  }
});

/* ---- Videos nur auf der aktiven Folie laufen lassen ---- */
function syncVideos(){
  els.forEach((el,i)=>{
    el.querySelectorAll('video').forEach(v=>{
      if(i===idx){ v.play().catch(()=>{}); } else { v.pause(); v.currentTime = 0; }
    });
  });
}

document.addEventListener('keydown', e=>{
  if(e.target.classList?.contains('qcard')) return;
  if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();go(idx+1);}
  if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(idx-1);}
  if(e.key==='Home'){e.preventDefault();go(0);}
  if(e.key==='End'){e.preventDefault();go(els.length-1);}
  if(e.key==='r'||e.key==='R'){revealQuiz();}
});

go(0);
hydrateMedia();
</script>
